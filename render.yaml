services:
  - type: web
    name: ya-consulting-api
    env: node
    rootDir: backend
    buildCommand: "npm install && npx prisma generate && npx prisma db push --accept-data-loss"
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001

  - type: web
    name: ya-consulting-web
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ya-consulting-api
          envVarKey: RENDER_EXTERNAL_URL
